# Reuses reviewed platform checks and isolated recovery/MFA fixtures.
# Public source and isolated synthetic TLS/browser qualification only; no production authority.
# Fixture passwords below are synthetic and apply only to disposable loopback services.
name: LifeOS public source CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lifeos-public-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  NEXT_TELEMETRY_DISABLED: '1'
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CI_EVENT_SHA: ${{ github.sha }}
  CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
  CI_SOURCE_REPOSITORY: ${{ github.repository }}

jobs:
  checks:
    name: Unit, types and source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source and complete ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact source and single npm lock
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-files '*lock.json' '*lock.yaml' '*lock.yml' yarn.lock npm-shrinkwrap.json | wc -l)" -eq 1
      - name: Node with lock-bound npm download cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit and source contract tests (optional integrations are not acceptance)
        run: npm test
      - name: Generate route types without building an application
        run: node node_modules/next/dist/bin/next typegen
      - run: npm run typecheck
      - run: npm audit --audit-level=high
      - name: Preserve dependency identity
        run: git diff --exit-code -- package.json package-lock.json
  eligibility:
    name: Release eligibility
    needs: checks
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require the actual unit and type job to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Verify real full-green evidence and cumulative source policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-qualification.ts --wait
